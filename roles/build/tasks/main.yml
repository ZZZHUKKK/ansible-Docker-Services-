---
- name: Git checkout
  ansible.builtin.git:
    repo: 'https://github.com/ZZZHUKKK/docker_app.git'
    dest: "{{ git_folder }}"
    version: app5(nginx)

- name: Tag and push to docker hub
  community.docker.docker_image:
    name: "{{ registry }}{{ item.name }}"
    tag: "{{ item.version}}"
    push: true
    force_source: true
    force_tag: true
    build:
      path: "{{ git_folder }}"
      dockerfile: "{{ git_folder }}/apps/{{ item.name }}/Dockerfile"
    source: build
  loop: "{{ services | difference(non_build_serv) }}"

- name: remove repo
  file:
    state: absent
    path: "{{ git_folder }}"