---
- name:  " [{{ names }}] deploy service"
  block:
    - name: "[{{ names }}]  deploy services"
      community.docker.docker_swarm_service:
        name: "{{ names }}"
        image: "{{ registry }}{{ names }}:{{ version }}"
        state: present
        force_update: true
        networks:
          - name: "{{ NETname }}"
        publish:
          - mode: ingress
            protocol: tcp
            published_port: 3001
            target_port: 80
